services:
  step-ca:
    image: smallstep/step-ca:latest
    container_name: global-step-ca
    restart: always
    profiles: ["local"]
    environment:
      - DOCKER_STEPCA_INIT_NAME=Local-CA
      - DOCKER_STEPCA_INIT_DNS_NAMES=step-ca,localhost,global-step-ca
      - DOCKER_STEPCA_INIT_PROVISIONER_NAME=admin@localhost
      - DOCKER_STEPCA_INIT_PASSWORD=${STEP_CA_PASSWORD:-StepCAPassword123!}
      - DOCKER_STEPCA_INIT_ACME=true
    volumes:
      - step-ca-data:/home/step
    networks:
      - global-transit-network

  traefik-global:
    image: traefik:v3.6
    container_name: global-traefik-leader
    restart: always
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # Filtro para leer solo infraestructura global
      - "--providers.docker.constraints=Label(`traefik.tier`,`global`)"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls.certresolver=${CERT_RESOLVER:-local-acme}"
      # Resolver ACME Local (step-ca para entorno local)
      - "--certificatesresolvers.local-acme.acme.caserver=https://step-ca:9000/acme/acme/directory"
      - "--certificatesresolvers.local-acme.acme.httpchallenge=true"
      - "--certificatesresolvers.local-acme.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.local-acme.acme.email=${ACME_EMAIL:-admin@localhost}"
      - "--certificatesresolvers.local-acme.acme.storage=/letsencrypt/acme-local.json"
      - "--serversTransport.insecureSkipVerify=true"
      # Resolver de Let's Encrypt para el entorno global (Producción)
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@localhost}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      # Proveedor de archivos dinámico (Certificados dinámicos/locales)
      - "--providers.file.filename=/etc/traefik/dynamic-conf.yml"
      - "--providers.file.watch=true"
    environment:
      - GLOBAL_DOMAIN=${GLOBAL_DOMAIN}
      - TRAEFIK_DASHBOARD_AUTH=${TRAEFIK_DASHBOARD_AUTH}
      - CERT_RESOLVER=${CERT_RESOLVER:-local-acme}
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"
      - "./certs:/certs:ro"
      - "./dynamic-conf.yml:/etc/traefik/dynamic-conf.yml:ro"
    networks:
      - global-transit-network
    labels:
      - "traefik.enable=true"
      - "traefik.tier=global"

  openobserve:
    image: openobserve/openobserve:v0.14.3
    container_name: global-openobserve
    restart: always
    environment:
      - ZO_ROOT_USER_EMAIL=${ZO_EMAIL:-admin@local.host}
      - ZO_ROOT_USER_PASSWORD=${ZO_PASSWORD:-AdminPassword123!}
      - ZO_LOCAL_MODE=true
    volumes:
      - openobserve-data:/data
    networks:
      - global-transit-network
    labels:
      - "traefik.enable=true"
      - "traefik.tier=global"
      - "traefik.http.routers.openobserve-http.rule=Host(`${OPENOBSERVE_SUBDOMAIN:-obs}.${GLOBAL_DOMAIN:-localhost}`)"
      - "traefik.http.routers.openobserve-http.entrypoints=web"
      - "traefik.http.routers.openobserve-http.service=openobserve"
      - "traefik.http.routers.openobserve-https.rule=Host(`${OPENOBSERVE_SUBDOMAIN:-obs}.${GLOBAL_DOMAIN:-localhost}`)"
      - "traefik.http.routers.openobserve-https.entrypoints=websecure"
      - "traefik.http.routers.openobserve-https.service=openobserve"
      - "traefik.http.routers.openobserve-https.tls=true"
      - "traefik.http.services.openobserve.loadbalancer.server.port=5080"

  infisical-db:
    image: postgres:14-alpine
    container_name: infisical-db
    restart: always
    environment:
      - POSTGRES_USER=${INFISICAL_DB_USER}
      - POSTGRES_PASSWORD=${INFISICAL_DB_PASSWORD}
      - POSTGRES_DB=${INFISICAL_DB_NAME}
    volumes:
      - infisical-pg-data:/var/lib/postgresql/data
    networks:
      - infisical-internal
    healthcheck:
      test: "pg_isready --username=${INFISICAL_DB_USER} && psql --username=${INFISICAL_DB_USER} --list"
      interval: 5s
      timeout: 10s
      retries: 10

  infisical-redis:
    image: redis:7-alpine
    container_name: infisical-redis
    restart: always
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - infisical-redis-data:/data
    networks:
      - infisical-internal

  infisical-backend:
    image: infisical/infisical:latest
    container_name: infisical-backend
    restart: unless-stopped
    depends_on:
      infisical-db:
        condition: service_healthy
      infisical-redis:
        condition: service_started
    environment:
      - NODE_ENV=production
      - ENCRYPTION_KEY=${INFISICAL_ENCRYPTION_KEY}
      - AUTH_SECRET=${INFISICAL_AUTH_SECRET}
      - DB_CONNECTION_URI=postgres://${INFISICAL_DB_USER}:${INFISICAL_DB_PASSWORD}@infisical-db:5432/${INFISICAL_DB_NAME}
      - REDIS_URL=redis://infisical-redis:6379
      - SITE_URL=https://secrets.${GLOBAL_DOMAIN:-localhost}
      # Configuración de Servidor de Correo (SMTP)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Infisical}
      - SMTP_SECURE=${SMTP_SECURE:-false}
    networks:
      - global-transit-network
      - infisical-internal
    labels:
      - "traefik.enable=true"
      - "traefik.tier=global"
      - "traefik.docker.network=global-transit-network"
      - "traefik.http.routers.infisical-http.rule=Host(`${INFISICAL_SUBDOMAIN:-secrets}.${GLOBAL_DOMAIN:-localhost}`)"
      - "traefik.http.routers.infisical-http.entrypoints=web"
      - "traefik.http.routers.infisical-http.service=infisical"
      - "traefik.http.routers.infisical-https.rule=Host(`${INFISICAL_SUBDOMAIN:-secrets}.${GLOBAL_DOMAIN:-localhost}`)"
      - "traefik.http.routers.infisical-https.entrypoints=websecure"
      - "traefik.http.routers.infisical-https.service=infisical"
      - "traefik.http.routers.infisical-https.tls=true"
      - "traefik.http.services.infisical.loadbalancer.server.port=8080"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: global-cloudflared
    restart: always
    profiles:
      - tunnel
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - global-transit-network

networks:
  global-transit-network:
    external: true

  infisical-internal:
    internal: true

volumes:
  step-ca-data:
  openobserve-data:

  infisical-pg-data:
  infisical-redis-data:

