services:
  traefik-global:
    image: traefik:v3.6
    container_name: global-traefik-leader
    restart: always
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # Filtro para leer solo infraestructura global
      - "--providers.docker.constraints=Label(`traefik.tier`,`global`)"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Resolver de Let's Encrypt para el entorno global
      - "--certificatesresolvers.letsencrypt-global.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt-global.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt-global.acme.email=${ACME_EMAIL:-admin@localhost}"
      - "--certificatesresolvers.letsencrypt-global.acme.storage=/letsencrypt/acme.json"
      # Proveedor de archivos dinámico (Certificados mkcert en local)
      - "--providers.file.filename=/etc/traefik/dynamic-conf.yml"
      - "--providers.file.watch=true"
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"
      - "./certs:/certs:ro"
      - "./dynamic-conf.yml:/etc/traefik/dynamic-conf.yml:ro"
    networks:
      - global-transit-network
    labels:
      - "traefik.enable=true"
      - "traefik.tier=global"
      - "traefik.http.routers.dashboard-global.rule=Host(`traefik.${TRAEFIK_GLOBAL_DOMAIN}`)"
      - "traefik.http.routers.dashboard-global.entrypoints=web,websecure"
      - "traefik.http.routers.dashboard-global.service=api@internal"
      - "traefik.http.routers.dashboard-global.middlewares=auth-dashboard-global"
      - "traefik.http.routers.dashboard-global.tls=true"
      - "traefik.http.middlewares.auth-dashboard-global.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"

  openobserve:
    image: openobserve/openobserve:v0.14.3
    container_name: global-openobserve
    restart: always
    environment:
      - ZO_ROOT_USER_EMAIL=${ZO_EMAIL:-admin@local.host}
      - ZO_ROOT_USER_PASSWORD=${ZO_PASSWORD:-AdminPassword123!}
      - ZO_LOCAL_MODE=true
    volumes:
      - openobserve-data:/data
    networks:
      - global-transit-network
    labels:
      - "traefik.enable=true"
      - "traefik.tier=global"
      - "traefik.http.routers.openobserve.rule=Host(`${OPENOBSERVE_SUBDOMAIN:-obs}.${GLOBAL_DOMAIN:-localhost}`)"
      - "traefik.http.routers.openobserve.entrypoints=web,websecure"
      - "traefik.http.routers.openobserve.tls=true"
      - "traefik.http.services.openobserve.loadbalancer.server.port=5080"

  infisical-db:
    image: postgres:14-alpine
    container_name: infisical-db
    restart: always
    environment:
      - POSTGRES_USER=${INFISICAL_DB_USER}
      - POSTGRES_PASSWORD=${INFISICAL_DB_PASSWORD}
      - POSTGRES_DB=${INFISICAL_DB_NAME}
    volumes:
      - infisical-pg-data:/var/lib/postgresql/data
    networks:
      - infisical-internal
    healthcheck:
      test: "pg_isready --username=${INFISICAL_DB_USER} && psql --username=${INFISICAL_DB_USER} --list"
      interval: 5s
      timeout: 10s
      retries: 10

  infisical-redis:
    image: redis:7-alpine
    container_name: infisical-redis
    restart: always
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - infisical-redis-data:/data
    networks:
      - infisical-internal

  infisical-backend:
    image: infisical/infisical:latest
    container_name: infisical-backend
    restart: unless-stopped
    depends_on:
      infisical-db:
        condition: service_healthy
      infisical-redis:
        condition: service_started
    environment:
      - NODE_ENV=production
      - ENCRYPTION_KEY=${INFISICAL_ENCRYPTION_KEY}
      - AUTH_SECRET=${INFISICAL_AUTH_SECRET}
      - DB_CONNECTION_URI=postgres://${INFISICAL_DB_USER}:${INFISICAL_DB_PASSWORD}@infisical-db:5432/${INFISICAL_DB_NAME}
      - REDIS_URL=redis://infisical-redis:6379
      - SITE_URL=https://secrets.${GLOBAL_DOMAIN:-localhost}
    networks:
      - global-transit-network
      - infisical-internal
    labels:
      - "traefik.enable=true"
      - "traefik.tier=global"
      - "traefik.docker.network=global-transit-network"
      - "traefik.http.routers.infisical.rule=Host(`${INFISICAL_SUBDOMAIN:-secrets}.${GLOBAL_DOMAIN:-localhost}`)"
      - "traefik.http.routers.infisical.entrypoints=web,websecure"
      - "traefik.http.routers.infisical.tls=true"
      - "traefik.http.services.infisical.loadbalancer.server.port=8080"
networks:
  global-transit-network:
    external: true

  infisical-internal:
    internal: true

volumes:
  openobserve-data:

  infisical-pg-data:
  infisical-redis-data:
