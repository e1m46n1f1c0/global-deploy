version: '3.8'

services:
  traefik-global:
    image: traefik:v3.0
    container_name: global-traefik-leader
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # ports: (cuando queremos abrir los puertos a travez de la red publica)
      #   - "${HTTP_PORT}:80"
      #   - "${HTTPS_PORT}:443"
      - "8080:8080" # Traefik Dashboard (cierra los puertos cuando usamos el tunel de cloudflare)
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - global-transit-network

networks:
  global-transit-network:
    external: true
