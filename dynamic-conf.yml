http:
  routers:
    # Router HTTP (Puerto 80)
    dashboard-global-http:
      rule: "Host(`traefik.localhost`) || HostRegexp(`^traefik\\..+$`)"
      entryPoints:
        - "web"
      service: "api@internal"
      middlewares:
        - "redirect-dashboard-global"
        - "auth-dashboard-global"

    # Router HTTPS (Puerto 443)
    dashboard-global-https:
      rule: "Host(`traefik.localhost`) || HostRegexp(`^traefik\\..+$`)"
      entryPoints:
        - "websecure"
      service: "api@internal"
      middlewares:
        - "redirect-dashboard-global"
        - "auth-dashboard-global"
      tls: true

  middlewares:
    redirect-dashboard-global:
      redirectRegex:
        regex: "^(https?://[^/]+)/?$"
        replacement: "${1}/dashboard/"
        permanent: true

    auth-dashboard-global:
      basicAuth:
        users:
          - "admin:$apr1$W0lcW8DY$6O2IV2AwPfArKCTCu5uE70"
