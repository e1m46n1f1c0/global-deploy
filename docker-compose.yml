services:
  traefik-global:
    image: traefik:v3.6
    container_name: global-traefik-leader
    restart: always
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # Filtro para leer solo infraestructura global
      - "--providers.docker.constraints=Label(`traefik.tier`,`global`)"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
      - "${DASHBOARD_PORT}:8080" # Traefik Dashboard (Development only)
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - global-transit-network

networks:
  global-transit-network:
    external: true
